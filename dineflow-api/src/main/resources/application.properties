spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dineflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT: JWT_SECRET is required and must be at least 32 characters
dineflow.security.jwt.secret=${JWT_SECRET}
dineflow.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

logging.level.org.springframework.web=INFO
